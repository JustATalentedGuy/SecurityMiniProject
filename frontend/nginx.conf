server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 101m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
    }
    location = /health { proxy_pass http://backend:8000; }
    location = /docs { proxy_pass http://backend:8000; add_header X-Content-Type-Options nosniff; }
    location = /openapi.json { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
